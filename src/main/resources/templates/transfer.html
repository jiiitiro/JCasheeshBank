<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheez - Transfer Money</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen text-slate-800 pb-12">

<!-- Top Navigation Bar -->
<header class="w-full bg-white/80 backdrop-blur-xl border-b border-white/20 sticky top-0 z-50 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
    <a th:href="@{/dashboard}" class="flex items-center">
        <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-48 h-auto drop-shadow-sm">
    </a>
    <a th:href="@{/dashboard}" class="text-xs font-extrabold text-indigo-600 hover:text-indigo-800 transition-colors bg-white/60 px-4 py-2 rounded-xl border border-white/40">
        ← Dashboard
    </a>
</header>

<!-- Main Container -->
<main class="max-w-md mx-auto px-4 mt-8">
    <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-8 sm:p-10 border border-white/40 shadow-2xl shadow-slate-900/10">

        <!-- Header Section with Send Money Icon -->
        <div class="mb-6 flex items-center gap-3">
            <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner font-extrabold">
                ↗
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Transfer Money</h1>
                <p class="text-slate-500 text-xs mt-0.5">Send funds instantly to another bestie.</p>
            </div>
        </div>

        <!-- Available Balance Badge -->
        <div class="mb-6 p-4 bg-slate-100/80 rounded-2xl border border-slate-200/60 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Available Balance</span>
            <strong class="text-base font-extrabold text-indigo-600" th:text="|₱${#numbers.formatDecimal(user.balance, 1, 2)}|">₱0.00</strong>
        </div>

        <!-- Error Message Alert -->
        <div th:if="${error}" class="mb-6 p-4 bg-pink-50 border-l-4 border-pink-500 text-pink-700 text-sm rounded-r-2xl shadow-sm font-medium" th:text="${error}">
            Error message
        </div>

        <!-- Transfer Form -->
        <form method="post" th:action="@{/transfer}" class="space-y-4">
            <div>
                <label for="receiverMobileNumber" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Receiver Mobile Number</label>
                <input id="receiverMobileNumber" name="receiverMobileNumber" type="text" maxlength="15" placeholder="09xxxxxxxxx" required
                       class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
            </div>

            <div>
                <label for="amount" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Amount (PHP)</label>
                <div class="relative">
                    <span class="absolute left-4 top-3.5 text-slate-400 font-extrabold text-sm">₱</span>
                    <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required
                           class="w-full pl-9 pr-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
                </div>
            </div>

            <button class="w-full mt-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all" type="submit">
                Send Money 🚀
            </button>
        </form>

        <!-- Footer Note -->
        <div class="mt-8 text-center text-xs font-semibold text-slate-400 tracking-wide">
            SECURE &bull; VIBE CHECKED
        </div>
    </div>
</main>

</body>
</html>
