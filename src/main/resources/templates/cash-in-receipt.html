<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheez - Cash In Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen text-slate-800 pb-12">

<main class="max-w-md mx-auto px-4 mt-12">
    <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-8 sm:p-10 border border-white/40 shadow-2xl shadow-slate-900/10 text-center">

        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl font-black mx-auto mb-4 shadow-inner">
            ✓
        </div>

        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Cash In Successful!</h1>
        <p class="text-slate-500 text-xs mt-1">Funds have been credited to your balance.</p>

        <div class="my-6 p-6 bg-slate-100/80 rounded-2xl border border-slate-200/60 text-left space-y-3">
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-slate-500 uppercase">Amount Cash In</span>
                <strong class="text-base font-black text-emerald-600" th:text="|₱${#numbers.formatDecimal(amount, 1, 2)}|">₱0.00</strong>
            </div>
            <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-slate-500 uppercase">New Balance</span>
                <strong class="text-sm font-extrabold text-indigo-600" th:text="|₱${#numbers.formatDecimal(user.balance, 1, 2)}|">₱0.00</strong>
            </div>
            <hr class="border-slate-200">
            <div class="flex justify-between items-center text-xs" th:if="${transaction != null}">
                <span class="font-bold text-slate-500 uppercase">Reference No.</span>
                <span class="font-mono font-bold text-slate-700" th:text="${transaction.referenceNumber}">1234 567 890123</span>
            </div>
            <div class="flex justify-between items-center text-xs" th:if="${transaction != null}">
                <span class="font-bold text-slate-500 uppercase">Date & Time</span>
                <span class="font-bold text-slate-700" th:text="${#temporals.format(transaction.transactionDate, 'MMM dd, yyyy HH:mm')}">Oct 14, 2026 00:22</span>
            </div>
        </div>

        <a th:href="@{/dashboard}" class="block w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all">
            Back to Dashboard
        </a>

    </div>
</main>

</body>
</html>
