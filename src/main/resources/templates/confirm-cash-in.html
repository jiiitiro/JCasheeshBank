<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheez - Confirm Cash In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen text-slate-800 pb-12">

<header class="w-full bg-white/80 backdrop-blur-xl border-b border-white/20 sticky top-0 z-50 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
    <a th:href="@{/dashboard}" class="flex items-center">
        <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-48 h-auto drop-shadow-sm">
    </a>
    <a th:href="@{/cash-in}" class="text-xs font-extrabold text-indigo-600 hover:text-indigo-800 transition-colors bg-white/60 px-4 py-2 rounded-xl border border-white/40">
        ← Cancel
    </a>
</header>

<main class="max-w-md mx-auto px-4 mt-8">
    <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-8 sm:p-10 border border-white/40 shadow-2xl shadow-slate-900/10">

        <div class="mb-6 flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center text-lg font-black shadow-inner">🔍</div>
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Confirm Cash In</h1>
                <p class="text-slate-500 text-xs mt-0.5">Please review transaction details before proceeding.</p>
            </div>
        </div>

        <div th:if="${error}" class="mb-6 p-4 bg-pink-50 border-l-4 border-pink-500 text-pink-700 text-sm rounded-r-2xl shadow-sm font-medium" th:text="${error}">
            Error message
        </div>

        <div class="space-y-4 bg-slate-100/80 p-6 rounded-2xl border border-slate-200/60 mb-6">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Account Holder</span>
                <strong class="text-sm font-extrabold text-slate-900" th:text="${user.fullName}">User Full Name</strong>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Mobile Number</span>
                <span class="text-sm font-bold text-slate-700" th:text="${user.mobileNumber}">09123456789</span>
            </div>
            <hr class="border-slate-200">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Cash In Amount</span>
                <strong class="text-lg font-black text-indigo-600" th:text="|₱${#numbers.formatDecimal(amount, 1, 2)}|">₱0.00</strong>
            </div>
        </div>

        <form method="post" th:action="@{/cash-in/execute}">
            <input type="hidden" name="amount" th:value="${amount}">

            <button class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all" type="submit">
                Confirm & Add Funds 💳
            </button>
        </form>

    </div>
</main>

</body>
</html>
