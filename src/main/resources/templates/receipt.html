<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheesh - Express Send Receipt</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen text-slate-800 pb-12">

<!-- Top Navigation Bar -->
<header class="w-full bg-white/80 backdrop-blur-xl border-b border-white/20 sticky top-0 z-50 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
    <a th:href="@{/dashboard}" class="flex items-center">
        <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-48 h-auto drop-shadow-sm">
    </a>
    <a th:href="@{/dashboard}" class="text-xs font-extrabold text-indigo-600 hover:text-indigo-800 transition-colors bg-white/60 px-4 py-2 rounded-xl border border-white/40">
        ← Dashboard
    </a>
</header>

<!-- Main Container -->
<main class="max-w-md mx-auto px-4 mt-8">

    <!-- Receipt Glassmorphism Card -->
    <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-8 sm:p-10 border border-white/40 shadow-2xl shadow-slate-900/10 text-center relative pt-12">

        <!-- Success Animated Check Badge -->
        <div class="absolute -top-7 left-1/2 -translate-x-1/2 w-16 h-16 bg-emerald-500 text-white rounded-full flex items-center justify-center font-extrabold text-2xl shadow-lg shadow-emerald-500/30 border-4 border-white">
            ✓
        </div>

        <!-- Recipient Masked Name & Mobile -->
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight uppercase"
            th:text="${recipientName != null ? recipientName : 'JCasheesh User'}">
            MA••A F. E.
        </h2>

        <div class="inline-block mt-2 px-4 py-1.5 bg-slate-100 rounded-full text-slate-600 text-xs font-bold tracking-wide"
             th:text="${recipientMobile != null ? recipientMobile : 'N/A'}">
            +63 916 136 9671
        </div>

        <small class="block text-slate-400 text-xs font-semibold mt-1">Sent via JCasheesh Express</small>

        <!-- Amount Breakdown -->
        <div class="mt-8 pt-6 border-t border-slate-200/60 space-y-3">
            <div class="flex justify-between items-center text-xs font-bold text-slate-500 uppercase tracking-wider">
                <span>Amount</span>
                <span class="text-slate-900 font-extrabold text-sm"
                      th:text="${transaction != null and transaction.amount != null ? #numbers.formatDecimal(transaction.amount, 1, 2) : '0.00'}">50.00</span>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                <span class="text-sm font-extrabold text-slate-900">Total Amount Sent</span>
                <span class="text-2xl font-extrabold text-indigo-600">
                    ₱<span th:text="${transaction != null and transaction.amount != null ? #numbers.formatDecimal(transaction.amount, 1, 2) : '0.00'}">50.00</span>
                </span>
            </div>
        </div>

        <!-- Reference Number & Timestamp Box -->
        <div class="mt-8 pt-6 border-t border-slate-200/60 space-y-1">
            <div class="text-xs font-semibold text-slate-500">
                Ref No. <strong class="text-slate-900 font-extrabold"
                                th:text="${transaction != null and transaction.referenceNumber != null ? transaction.referenceNumber : 'N/A'}">0044 699 769682</strong>
            </div>
            <div class="text-[11px] font-semibold text-slate-400"
                 th:text="${transaction != null and transaction.transactionDate != null ? #temporals.format(transaction.transactionDate, 'MMM dd, yyyy hh:mm a') : ''}">
                Oct 11, 2026 10:31 PM
            </div>
        </div>

        <!-- Return to Dashboard Action Button -->
        <div class="mt-8">
            <a th:href="@{/dashboard}"
               class="block w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all">
                Back to Dashboard 🚀
            </a>
        </div>
    </div>

    <!-- Footer Tagline -->
    <div class="mt-8 text-center text-xs font-semibold text-slate-400 tracking-wide">
        SECURE &bull; VIBE CHECKED
    </div>
</main>

</body>
</html>
