<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheesh! - Access Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white/90 backdrop-blur-2xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.3)] rounded-[2.5rem] p-8 sm:p-10 border border-white/40">

    <!-- Brand Logo Image Integration -->
    <div class="flex justify-center mb-6">
        <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-60 h-auto drop-shadow-md">
    </div>

    <!-- Header Text -->
    <div class="text-center mb-6">
        <h1 id="form-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome back bestie! ✨</h1>
        <p id="form-subtitle" class="text-slate-500 text-sm mt-1">Drop your deets to log in.</p>
    </div>

    <!-- Error Message Alert -->
    <div th:if="${error}" class="mb-6 p-4 bg-pink-50 border-l-4 border-pink-500 text-pink-700 text-sm rounded-r-2xl shadow-sm font-medium" role="alert">
        <span th:text="${error}">Error message placeholder</span>
    </div>

    <!-- Success Message Alert -->
    <div th:if="${success}" class="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 text-sm rounded-r-2xl shadow-sm font-medium" role="alert">
        <span th:text="${success}">Success message placeholder</span>
    </div>

    <!-- Toggle Tabs for Login / Register -->
    <div class="flex bg-slate-200/70 p-1.5 rounded-2xl mb-6">
        <button type="button" id="login-tab" onclick="switchTab('login')" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all bg-white text-slate-900 shadow-sm">
            Sign In
        </button>
        <button type="button" id="register-tab" onclick="switchTab('register')" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all text-slate-500 hover:text-slate-900">
            Register
        </button>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" method="post" th:action="@{/login}" class="space-y-4">
        <div>
            <label for="login-mobile" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mobile Number</label>
            <input id="login-mobile" name="mobileNumber" type="text" maxlength="15"
                   placeholder="09xxxxxxxxx" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <div>
            <div class="flex items-center justify-between mb-2">
                <label for="login-pin" class="block text-xs font-bold text-slate-500 uppercase tracking-wider">PIN</label>
                <a th:href="@{/forgot-pin}" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">Forgot PIN?</a>
            </div>
            <input id="login-pin" name="pin" type="password" maxlength="20"
                   placeholder="• • • •" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <button type="submit"
                class="w-full mt-2 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all">
            Let's Go 🚀
        </button>
    </form>

    <!-- REGISTER FORM (Hidden by default) -->
    <form id="register-form" method="post" th:action="@{/register}" class="space-y-4 hidden">
        <div>
            <label for="fullName" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Full Name</label>
            <input id="fullName" name="fullName" type="text" maxlength="100"
                   placeholder="e.g. Dennis Trillo" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <div>
            <label for="reg-mobile" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mobile Number</label>
            <input id="reg-mobile" name="mobileNumber" type="text" maxlength="15"
                   placeholder="09xxxxxxxxx" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <div>
            <label for="reg-email" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
            <input id="reg-email" name="email" type="email" maxlength="100"
                   placeholder="bestie@example.com" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <div>
            <label for="reg-pin" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Create PIN</label>
            <input id="reg-pin" name="pin" type="password" maxlength="20"
                   placeholder="• • • •" required
                   class="w-full px-4 py-3.5 bg-slate-100/80 border-2 border-transparent rounded-2xl text-slate-900 placeholder-slate-400 text-sm font-medium focus:outline-none focus:border-indigo-600 focus:bg-white transition-all">
        </div>

        <button type="submit"
                class="w-full mt-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-blue-600/30 active:scale-[0.98] transition-all">
            Create Account ✨
        </button>
    </form>

    <!-- Footer Note -->
    <div class="mt-8 text-center text-xs font-semibold text-slate-400 tracking-wide">
        SECURE &bull; VIBE CHECKED
    </div>
</div>

<!-- Client-side tab switching script -->
<script>
    function switchTab(tab) {
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const title = document.getElementById('form-title');
        const subtitle = document.getElementById('form-subtitle');

        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            loginTab.className = "flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all bg-white text-slate-900 shadow-sm";
            registerTab.className = "flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all text-slate-500 hover:text-slate-900";
            title.textContent = "Welcome back bestie! ✨";
            subtitle.textContent = "Drop your deets to log in.";
        } else {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            registerTab.className = "flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all bg-white text-slate-900 shadow-sm";
            loginTab.className = "flex-1 py-2.5 text-xs font-extrabold rounded-xl transition-all text-slate-500 hover:text-slate-900";
            title.textContent = "Join the Club 🚀";
            subtitle.textContent = "Set up your account in seconds.";
        }
    }
</script>
</body>
</html>
