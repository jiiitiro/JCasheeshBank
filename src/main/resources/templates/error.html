<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheez - Error</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen flex items-center justify-center p-4 text-slate-800">

<div class="w-full max-w-md bg-white/90 backdrop-blur-2xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.3)] rounded-[2.5rem] p-8 sm:p-10 border border-white/45 text-center">

    <!-- Brand Logo -->
    <div class="flex justify-center mb-6">
        <a th:href="@{/dashboard}">
            <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-48 h-auto drop-shadow-sm mx-auto">
        </a>
    </div>

    <!-- Heading -->
    <div class="mb-6">
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Oops, something went wrong! 😅</h1>
        <p class="text-slate-500 text-sm mt-1">Don't worry, let's get you back on track.</p>
    </div>

    <!-- Error Message Alert -->
    <div class="mb-8 p-4 bg-pink-50 border-l-4 border-pink-500 text-pink-700 text-sm rounded-r-2xl shadow-sm font-medium text-left" th:text="${error}">
        Error message placeholder
    </div>

    <!-- Back to Dashboard Action -->
    <a th:href="@{/dashboard}"
       class="w-full block bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold py-4 px-4 rounded-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all text-center">
        Back to Dashboard 🚀
    </a>

    <!-- Footer Note -->
    <div class="mt-8 text-center text-xs font-semibold text-slate-400 tracking-wide">
        SECURE &bull; VIBE CHECKED
    </div>
</div>

</body>
</html>
