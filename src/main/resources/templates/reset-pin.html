<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCash Bank - Reset PIN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

<!-- Decorative background blobs for rich gradient effect -->
<div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

<div class="w-full max-w-md bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-2xl p-8 md:p-10 border border-white/20 relative overflow-hidden z-10">

    <!-- Brand / Logo Area -->
    <div class="text-center mb-8 pt-2">
        <div class="flex justify-center mb-6">
            <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-60 h-auto drop-shadow-md">
        </div>

        <h2 class="text-xl font-bold text-slate-800">Set New PIN</h2>
        <p class="text-slate-500 text-xs mt-1">Please enter your secure new PIN below.</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="mb-6 p-4 bg-rose-50 border border-rose-200/60 text-rose-700 text-sm rounded-2xl flex items-center space-x-3">
        <svg class="w-5 h-5 text-rose-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span th:text="${error}">Error message</span>
    </div>

    <!-- Reset PIN Form -->
    <form th:action="@{/reset-pin}" method="POST" class="space-y-5">
        <!-- Hidden Token field passed from URL parameter -->
        <input type="hidden" name="token" th:value="${token}">

        <div>
            <label for="newPin" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">New PIN</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                <input type="password" id="newPin" name="newPin" required maxlength="6"
                       class="w-full pl-12 pr-4 py-3.5 rounded-2xl border border-slate-200 bg-slate-50/50 text-slate-900 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
                       placeholder="Enter new PIN">
            </div>
        </div>

        <button type="submit"
                class="w-full py-4 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-500/25 transition-all text-sm tracking-wide">
            Update PIN 🚀
        </button>
    </form>

    <!-- Back to Login Link -->
    <div class="text-center mt-8">
        <a th:href="@{/login}" class="inline-flex items-center text-xs font-bold text-slate-600 hover:text-indigo-600 transition-colors">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Login
        </a>
    </div>
</div>

</body>
</html>
