<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCasheez - Transaction History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-tr from-purple-900 via-indigo-950 to-blue-900 min-h-screen text-slate-800 pb-12">

<!-- Top Navigation Bar -->
<header class="w-full bg-white/80 backdrop-blur-xl border-b border-white/20 sticky top-0 z-50 px-4 sm:px-8 py-3 flex items-center justify-between shadow-sm">
    <a th:href="@{/dashboard}" class="flex items-center">
        <img th:src="@{/images/logo.svg}" alt="JCasheesh Logo" class="w-48 h-auto drop-shadow-sm">
    </a>
    <a th:href="@{/dashboard}" class="text-xs font-extrabold text-indigo-600 hover:text-indigo-800 transition-colors bg-white/60 px-4 py-2 rounded-xl border border-white/40">
        ← Dashboard
    </a>
</header>

<!-- Main Container -->
<main class="max-w-3xl mx-auto px-4 mt-8 space-y-6">

    <!-- Header Section with Transactions Icon -->
    <div class="bg-white/90 backdrop-blur-2xl rounded-[2.5rem] p-6 sm:p-8 border border-white/40 shadow-2xl shadow-slate-900/10">
        <div class="flex items-center justify-between mb-6 pb-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center text-2xl shadow-inner font-extrabold">
                    ☷
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Transaction History</h1>
                    <p class="text-slate-500 text-xs mt-0.5 font-medium" th:text="${user.fullName}">User</p>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(transactions)}" class="text-center py-12 text-slate-400 font-medium text-sm">
            No transactions yet bestie. Time to fund your account! 🚀
        </div>

        <!-- Transaction Rows -->
        <div class="space-y-4" th:unless="${#lists.isEmpty(transactions)}">
            <div th:each="tx : ${transactions}" class="flex items-center justify-between p-4 bg-slate-50/80 rounded-2xl border border-slate-100/80 hover:bg-slate-100/80 transition-colors">
                <div>
                    <strong class="block text-slate-900 text-sm font-extrabold" th:text="${tx.type}">CASH_IN</strong>
                    <small class="text-slate-500 text-xs font-medium" th:text="${tx.details}">Details</small>
                </div>
                <div class="text-right">
                    <strong class="block text-slate-900 text-sm font-extrabold" th:text="|₱${#numbers.formatDecimal(tx.amount, 1, 2)}|">₱0.00</strong>
                    <small class="text-slate-400 text-[11px] font-medium" th:text="${#temporals.format(tx.transactionDate, 'MMM d, yyyy h:mm a')}">Date</small>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
