<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
    <defs>
        <!-- Background Gradient for the Icon Box -->
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="50%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>

        <!-- Text Gradient -->
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#1e1b4b" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>

        <!-- Drop Shadow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35"/>
        </filter>
    </defs>

    <!-- Icon Container Box -->
    <g transform="translate(15, 15)" filter="url(#glow)">
        <rect width="90" height="90" rx="28" fill="url(#logoGrad)" transform="rotate(-3 45 45)" />
        <!-- Inner Spark / Wallet Symbol -->
        <path d="M30 45 L45 30 L60 45 L45 60 Z" fill="white" opacity="0.15" />
        <text x="45" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">₱</text>
    </g>

    <!-- Typography: JCasheesh! -->
    <text x="130" y="73" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="42" fill="url(#textGrad)" letter-spacing="-1">
        JCasheesh<tspan fill="#9333ea">!</tspan>
    </text>

    <!-- Subtle Tagline -->
    <text x="132" y="96" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="2">
        SECURE • VIBE CHECKED
    </text>
</svg>