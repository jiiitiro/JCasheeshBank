spring.application.name=jcash-bank

# PostgreSQL Database
# Checks for Railway / custom env vars first, falling back to Docker Compose 'postgres' service name, then default values
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://postgres:5432/jcasheesh_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false

# Server Configuration (Dynamically binds to Railway's assigned $PORT, fallback to 8081 for local dev)
server.port=${PORT:8081}

# App & Third-Party Service Configurations
resend.api.key=${RESEND_API_KEY:dummy_key_for_dev}
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Spring Mail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
