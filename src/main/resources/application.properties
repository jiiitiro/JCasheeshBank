spring.application.name=jcash-bank

# PostgreSQL Database
# Connects to 'postgres-jcash' inside Docker network; defaults to localhost:5434 for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/jcasheesh_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080

# App & Third-Party Service Configurations
resend.api.key=${RESEND_API_KEY:dummy_key_for_dev}
app.base-url=${APP_BASE_URL:http://localhost:8081}

# Spring Mail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
