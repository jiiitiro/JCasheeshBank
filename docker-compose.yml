version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jcasheesh-db
    environment:
      TZ: Asia/Manila
      PGTZ: Asia/Manila
      POSTGRES_DB: ${POSTGRES_DB:-jcasheesh_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-jcasheesh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jcasheesh-net

  app:
    build: .
    container_name: jcasheesh-app
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Manila
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Manila"
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
      SPRING_DATASOURCE_USERNAME: ${PGUSER}
      SPRING_DATASOURCE_PASSWORD: ${PGPASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jcasheesh-net

volumes:
  pgdata:

networks:
  jcasheesh-net:
    driver: bridge
