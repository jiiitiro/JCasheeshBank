version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: jcasheesh-db
    environment:
      POSTGRES_DB: jcasheesh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 052824Miby
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - jcasheesh-net

  app:
    build: .
    container_name: jcasheesh-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jcasheesh_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=052824Miby
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    networks:
      - jcasheesh-net

volumes:
  pgdata:

networks:
  jcasheesh-net:
    driver: bridge